<div class="booking-wrapper">
  <div class="booking-card">
    <h2 class="form-title">Booking Movie Tickets </h2>
    
    <form class="row g-3 needs-validation" novalidate>
      <div class="col-md-4 position-relative">
        <label for="validationTooltip01" class="form-label">First name</label>
        <input type="text" class="form-control" id="validationTooltip01" required>
        <div class="valid-tooltip">Looks good!</div>
      </div>

      <div class="col-md-4 position-relative">
        <label for="validationTooltip02" class="form-label">Last name</label>
        <input type="text" class="form-control" id="validationTooltip02" required>
        <div class="valid-tooltip">Looks good!</div>
      </div>

      <div class="col-md-4 position-relative">
        <label for="validationTooltipUsername" class="form-label">Username</label>
        <div class="input-group has-validation">
          <span class="input-group-text" id="validationTooltipUsernamePrepend">@</span>
          <input type="text" class="form-control" id="validationTooltipUsername" aria-describedby="validationTooltipUsernamePrepend" required>
          <div class="invalid-tooltip">Please choose a unique and valid username.</div>
        </div>
      </div>

      <div class="col-md-6 position-relative">
        <label for="validationTooltip03" class="form-label">City</label>
        <input type="text" class="form-control" id="validationTooltip03" required>
        <div class="invalid-tooltip">Please provide a valid city.</div>
      </div>

      <div class="col-md-3 position-relative">
        <label for="validationTooltipMovie" class="form-label">Movies</label>
        <select class="form-select" id="validationTooltipMovie" required>
          <option selected disabled value="">Choose Movie...</option>
          <option>Avatar 1</option>
          <option>Avatar The Way Of Water</option>
          <option>Avatar Fire And Ash</option>
          <option>The Lord of the Rings: The Fellowship of the Ring</option>
          <option>The Lord of the Rings: The Two Towers</option>
          <option>The Lord of the Rings: The Return of the King</option>
        </select>
        <div class="invalid-tooltip">Please select a movie.</div>
      </div>

      <div class="col-md-3 position-relative">
        <label for="validationTooltipSeats" class="form-label">Seats</label>
        <input type="number" class="form-control" id="validationTooltipSeats" min="1" required>
        <div class="invalid-tooltip">Please select valid Seats.</div>
      </div>
      
      <div class="col-12 text-center mt-4">
        <button class="btn btn-custom-submit w-100" type="submit">Submit form</button>
      </div>
    </form>
  </div>
</div>





<script src="./bootstrap.bundle.min.js"></script>
