<html lang="en">
<head>

    <link rel="stylesheet" href="./bootstrap.min.css.css">
    <title>Bookzilla</title>
</head>
<body>
  <nav class="navbar navbar-expand-lg custom-transparent">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Bookzilla</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="./index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="./booking.html">Booking</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="./movies.html">Movies</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="./premium.html">Premium</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="./profile.html">Profile</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="./signin.html">Sign In</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="./createaccount.html">Create Account</a>
        </li>
        
       
      </ul>
    </div>
  </div>
</nav>
<div class="auth-wrapper">
  <div class="auth-card">
    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-subtitle">Please enter your details to sign in</p>

    <form>
      <!-- Username Field -->
      <div class="mb-3">
        <label class="form-label">Username</label>
        <div class="input-group flex-nowrap">
          <span class="input-group-text" id="addon-wrapping">@</span>
          <input type="text" class="form-control" placeholder="Enter your username" aria-label="Username" aria-describedby="addon-wrapping" required>
        </div>
      </div>

      <!-- Password Field -->
      <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Password</label>
        <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Enter your password" required>
      </div>

      <!-- Remember Me & Checkbox -->
      <div class="mb-4 form-check d-flex justify-content-between align-items-center ps-0">
        <div class="d-flex align-items-center gap-2">
          <input type="checkbox" class="form-check-input ms-0" id="exampleCheck1">
          <label class="form-check-label mb-0" for="exampleCheck1">Remember me</label>
        </div>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>
      <p class="text-center mb-0 text-muted" style="font-size: 0.9rem;">
        I Don't Have An Account. <a href="./createaccount.html" class="auth-link font-weight-bold">Create Account</a>
      </p>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-auth-submit w-100">Sign In</button>
    </form>
  </div>
</div>







<script src="./bootstrap.bundle.min.js"></script>
</body>
</html>
